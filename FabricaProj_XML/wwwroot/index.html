<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coleta de NFC-e</title>
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>
    <main class="card">
        <header>
            <a href="index.html"><img class="logo" src="img/logo_nfe_horizontal.png" alt="Logo NFC-e" /></a>
            <div>
                <button type="button" id="btnConfig" title="Configurações" aria-label="Configurações" style="background-color: transparent; border: none; border-radius: 100%; height: 30px; width: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px;">
                    <i class="fa fa-solid fa-ellipsis"></i>
                </button>
            </div>
        </header>
        <!-- Ícone de configurações: por enquanto sem função definida -->

        <form id="formFiltro" novalidate>
            <label for="competencia">Digite a competência para realizar o filtro.</label>
            <div class="filtro">
                <input type="month" id="competencia" name="competencia" value="2026-10" required>
                <button type="submit" class="btn primary" id="btnBuscar"><strong>Buscar NFC-e</strong></button>
            </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <textarea id="resultado" spellcheck="false" readonly aria-label="JSON das notas fiscais" placeholder="O JSON das notas fiscais aparecerá aqui."></textarea>

        <div class="acoes">
            <button type="button" class="btn" id="btnEdit" disabled>Edit</button>
            <button type="button" class="btn" id="btnSave" disabled>Save</button>
            <button type="button" class="btn" id="btnDownload" disabled>Download .txt</button>
            <button type="button" class="btn primary" id="btnDownloadJson" disabled>Download .json</button>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/ajustes.js"></script>
</body>
</html>
